<!--
  muster — checklist template

  A working skeleton, not a finished design. Everything marked REPLACE is content; everything in
  :root is an identity that belongs to the subject, not to this file. Load the `artifact-design`
  skill and redesign the palette, the typefaces and the header before shipping.

  Published through the Artifact tool: drop the <!doctype>, <html>, <head> and <body> wrappers — the
  content below is already written for that. Written to disk as a plain file instead: wrap it.

  Fill in, in order:
    META     — title, subtitle, source, the interpretation note
    LABELS   — every UI string, in the user's language
    GROUPS   — the source's own grouping, in the source's own order
    ENTRIES  — [groupKey, title, tagline, [boxes], derived?]
-->
<title>REPLACE — page name</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* REPLACE: this palette is a placeholder. Pick one for the subject — and keep the token structure,
   which is what makes light, dark and system-default all resolve. */
:root{
  --bg:#F2F0F2; --surface:#FCFBFC; --surface-2:#F7F4F6;
  --line:#DED7DC; --line-strong:#C7BDC4;
  --ink:#191319; --ink-2:#4A414A; --muted:#7C7280;
  --accent:#C4006A; --accent-ink:#FFFFFF; --accent-wash:#FBE8F1; --done:#1C7A55;
  --ring:0 0 0 3px rgba(196,0,106,.28);
  --sh-1:0 1px 0 rgba(25,19,25,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131015; --surface:#1A171D; --surface-2:#201C24;
    --line:#2E2833; --line-strong:#463E4C;
    --ink:#EFEAEF; --ink-2:#C4BCC6; --muted:#948B99;
    --accent:#FF4D99; --accent-ink:#20040F; --accent-wash:#2A1420; --done:#4FC48D;
    --ring:0 0 0 3px rgba(255,77,153,.32);
    --sh-1:0 1px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#131015; --surface:#1A171D; --surface-2:#201C24;
  --line:#2E2833; --line-strong:#463E4C;
  --ink:#EFEAEF; --ink-2:#C4BCC6; --muted:#948B99;
  --accent:#FF4D99; --accent-ink:#20040F; --accent-wash:#2A1420; --done:#4FC48D;
  --ring:0 0 0 3px rgba(255,77,153,.32);
  --sh-1:0 1px 0 rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Public Sans","Segoe UI",system-ui,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
h1,h2,h3{font-family:"Archivo","Segoe UI",system-ui,sans-serif;text-wrap:balance;margin:0}

.masthead{border-bottom:1px solid var(--line);position:relative;
  background:linear-gradient(to right,color-mix(in srgb,var(--accent) 5%,transparent),transparent 55%),var(--surface)}
.masthead::after{content:"";position:absolute;inset:auto 0 0 0;height:2px;
  background:linear-gradient(to right,var(--accent) 0 var(--pct,0%),var(--line) var(--pct,0%) 100%)}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.masthead .wrap{display:flex;gap:32px;align-items:flex-end;justify-content:space-between;
  padding-top:28px;padding-bottom:24px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  display:flex;gap:10px;align-items:center}
.eyebrow a{color:inherit}
.eyebrow .tick{width:18px;height:1px;background:var(--line-strong);display:inline-block}
h1{font-size:clamp(30px,4.6vw,46px);font-weight:700;letter-spacing:-.02em;line-height:1.02;margin:10px 0 8px}
.lede{color:var(--ink-2);max-width:56ch}
.lede em{color:var(--ink);font-style:italic}

.score{display:flex;align-items:center;gap:16px}
.dial{width:74px;height:74px;flex:none}
.dial circle{fill:none;stroke-width:7}
.dial .track{stroke:var(--line)}
.dial .fill{stroke:var(--accent);transition:stroke-dashoffset .45s cubic-bezier(.22,.61,.36,1)}
.score-num{font-family:"Archivo",sans-serif;font-weight:700;font-size:26px;line-height:1}
.score-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.score-lbl b{color:var(--ink-2);font-weight:500}

.toolbar{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.toolbar .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.field{position:relative;flex:1 1 240px;min-width:200px}
.field input{width:100%;font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:3px;padding:8px 12px 8px 32px}
.field input::placeholder{color:var(--muted)}
.field svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 12px/1 "IBM Plex Mono",monospace;letter-spacing:.03em;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);border-radius:99px;padding:7px 12px;cursor:pointer;
  display:flex;gap:7px;align-items:center}
.chip .n{color:var(--muted);font-size:11px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:var(--bg);opacity:.65}
.tbtn{font:500 12px/1 "IBM Plex Mono",monospace;letter-spacing:.03em;border:1px solid var(--line);
  background:transparent;color:var(--ink-2);border-radius:3px;padding:8px 11px;cursor:pointer}
.tbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-wash)}
.tbtn.danger:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible{outline:none;box-shadow:var(--ring)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.page{display:grid;grid-template-columns:minmax(0,1fr);gap:40px;padding-block:32px 96px}
@media(min-width:1060px){.page{grid-template-columns:196px minmax(0,1fr)}}
.rail{display:none}
@media(min-width:1060px){.rail{display:block;position:sticky;top:74px;align-self:start;
  max-height:calc(100vh - 96px);overflow:auto}}
.rail h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin-bottom:12px}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rail a{display:block;text-decoration:none;color:var(--ink-2);padding:7px 8px;border-radius:3px;font-size:13px}
.rail a:hover{background:var(--surface-2);color:var(--ink)}
.rail .rn{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);display:block;letter-spacing:.06em}
.rail .bar{height:2px;background:var(--line);margin-top:6px;border-radius:2px;overflow:hidden}
.rail .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s ease-out}

.cat{margin-bottom:56px;scroll-margin-top:84px}
.cat-head{display:flex;align-items:baseline;gap:14px;padding-bottom:12px;
  border-bottom:1px solid var(--line-strong);margin-bottom:20px}
.cat-head h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.cat-head .en{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted)}
.cat-head .cnt{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;
  color:var(--muted);font-variant-numeric:tabular-nums}

.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:var(--sh-1);
  display:grid;grid-template-columns:64px minmax(0,1fr)}
@media(max-width:640px){.card{grid-template-columns:minmax(0,1fr)}}
.card.is-done{background:var(--surface-2)}
.gutter{border-right:1px solid var(--line);padding:16px 0 16px 14px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--muted)}
@media(max-width:640px){.gutter{border-right:none;border-bottom:1px solid var(--line);padding:12px 16px}}
.card.is-done .gutter{color:var(--done)}
.body{padding:16px 18px 18px}
.title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.title h3{font-size:16px;font-weight:600;letter-spacing:-.005em}
.title .frac{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
  margin-left:auto;font-variant-numeric:tabular-nums}
.card.is-done .title .frac{color:var(--done)}
.derived{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line-strong);border-radius:99px;padding:3px 7px}
.tag{font-style:italic;color:var(--muted);font-size:13.5px;margin:4px 0 12px;max-width:62ch}

.checks{display:flex;flex-direction:column;gap:2px}
.check{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:start;
  padding:6px 8px 6px 6px;margin-left:-6px;border-radius:3px;cursor:pointer;
  color:var(--ink-2);font-size:14px;line-height:1.5}
.check:hover{background:var(--surface-2)}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:16px;height:16px;margin-top:3px;border:1.5px solid var(--line-strong);border-radius:2px;
  display:grid;place-items:center;background:var(--surface);
  transition:background .12s ease-out,border-color .12s ease-out}
.box svg{opacity:0;transform:scale(.6);color:var(--accent-ink);
  transition:opacity .12s ease-out,transform .15s cubic-bezier(.2,.9,.3,1.3)}
.check input:checked + .box{background:var(--accent);border-color:var(--accent)}
.check input:checked + .box svg{opacity:1;transform:scale(1)}
.check input:checked ~ .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.check input:focus-visible + .box{box-shadow:var(--ring)}

.empty{border:1px dashed var(--line-strong);border-radius:4px;padding:40px 24px;
  text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:"Archivo",sans-serif;font-size:17px;margin-bottom:6px}

footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--muted);font-size:12.5px}
footer .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}
footer a{color:var(--ink-2)}

@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>

<header class="masthead">
  <div class="wrap">
    <div>
      <div class="eyebrow"><span class="tick"></span><a id="srcLink" href="#"></a></div>
      <h1 id="pageTitle"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="score">
      <svg class="dial" viewBox="0 0 80 80" aria-hidden="true">
        <circle class="track" cx="40" cy="40" r="33"></circle>
        <circle class="fill" id="dial" cx="40" cy="40" r="33" transform="rotate(-90 40 40)"
                stroke-dasharray="207.3" stroke-dashoffset="207.3"></circle>
      </svg>
      <div>
        <div class="score-num mono" id="pct">%0</div>
        <div class="score-lbl"><b id="doneN">0</b> / <span id="allN">0</span> <span id="unitLbl"></span></div>
      </div>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <div class="field">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <input id="q" type="search" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
    <button class="tbtn" id="onlyOpen" aria-pressed="false"></button>
    <button class="tbtn danger" id="reset"></button>
  </div>
</div>

<main class="wrap page">
  <nav class="rail" aria-label="sections"><h2 id="railLbl"></h2><ol id="rail"></ol></nav>
  <div id="out"></div>
</main>

<footer><div class="wrap"><span id="footL"></span><span id="footR"></span></div></footer>

<script>
/* ------------------------------------------------------------------ REPLACE: META */
const META = {
  title:    "REPLACE — page name",
  lede:     "REPLACE — one or two sentences: what this list is, where it came from, that ticks are stored in the browser.",
  sourceLabel: "REPLACE — example.com/source",
  sourceUrl:   "https://REPLACE",
  note:     "REPLACE — the interpretation line: which parts are the source's words and which are yours.",
  storageKey: "REPLACE-slug-v1"   /* changing this discards everyone's existing ticks */
};

/* ------------------------------------------------------------------ REPLACE: LABELS (user's language) */
const LABELS = {
  search:    "Search patterns or checks...",
  searchAria:"Search",
  all:       "All",
  onlyOpen:  "Only unfinished",
  reset:     "Reset",
  resetAsk:  "Clear every tick?",
  sections:  "Sections",
  unit:      "checks",
  entryWord: "entries",
  derived:   "interpreted",
  emptyTitle:"Nothing matches",
  emptyBody: "Shorten the search or drop the group filter."
};

/* ------------------------------------------------------------------ REPLACE: GROUPS
   The source's own grouping, in the source's own order. `code` prefixes the per-entry id (INT-04). */
const GROUPS = [
  {key:"interaction", code:"INT", label:"Interaction", sub:"Interaction"},
  {key:"forms",       code:"FRM", label:"Forms",       sub:"Forms"}
];

/* ------------------------------------------------------------------ REPLACE: ENTRIES
   [groupKey, title, tagline, [boxes], derived?]
     title    — the source's name for the entry, original spelling
     tagline  — the source's own line, kept as context. It is not a check.
     boxes    — 2-5 passing states, present tense, one thing each (references/item-rules.md)
     derived  — true when the boxes are your interpretation rather than the source's words */
const ENTRIES = [
  ["interaction","Disabled Buttons","The button is disabled, and nobody tells you why.",[
    "A disabled button states its reason: a tooltip, helper text or an inline error.",
    "Where possible the button stays enabled and the click marks what is missing.",
    "The disabled state stays readable; it does not fade into the background."], true],
  ["interaction","Tooltip Design","Your tooltip is annoying.",[
    "The tooltip opens on a delay and closes instantly.",
    "Nothing critical lives only in a tooltip.",
    "It opens on keyboard focus and survives the pointer moving onto it.",
    "Its position corrects against the viewport edge."], true],
  ["forms","Form Validation Timing","The error fires while you're still typing.",[
    "Errors appear after the field loses focus, not on the first keystroke.",
    "The error clears the moment the value becomes valid.",
    "On submit, focus moves to the first field that failed."], true]
];

/* ------------------------------------------------------------------ mechanics: no edits needed */
document.title = META.title;
document.getElementById("pageTitle").textContent = META.title;
document.getElementById("lede").textContent = META.lede;
const srcLink = document.getElementById("srcLink");
srcLink.textContent = META.sourceLabel; srcLink.href = META.sourceUrl;
document.getElementById("q").placeholder = LABELS.search;
document.getElementById("q").setAttribute("aria-label", LABELS.searchAria);
document.getElementById("onlyOpen").textContent = LABELS.onlyOpen;
document.getElementById("reset").textContent = LABELS.reset;
document.getElementById("railLbl").textContent = LABELS.sections;
document.getElementById("unitLbl").textContent = LABELS.unit;

let state = {};
try { state = JSON.parse(localStorage.getItem(META.storageKey) || "{}") || {}; } catch (e) { state = {}; }
function persist(){ try { localStorage.setItem(META.storageKey, JSON.stringify(state)); } catch (e) {} }

const byGroup = {};
GROUPS.forEach(g => byGroup[g.key] = []);
ENTRIES.forEach(e => byGroup[e[0]].push(e));
GROUPS.forEach(g => byGroup[g.key].forEach((e, i) => { e.id = g.code + "-" + String(i + 1).padStart(2, "0"); }));

const TOTAL = ENTRIES.reduce((n, e) => n + e[3].length, 0);
document.getElementById("allN").textContent = TOTAL;
document.getElementById("footL").textContent =
  ENTRIES.length + " " + LABELS.entryWord + " · " + GROUPS.length + " " + LABELS.sections.toLowerCase() +
  " · " + TOTAL + " " + LABELS.unit;
document.getElementById("footR").textContent = META.note;

let filterGroup = "all", query = "", onlyOpen = false;

const chipsEl = document.getElementById("chips");
chipsEl.innerHTML =
  '<button class="chip" data-g="all" aria-pressed="true">' + LABELS.all +
  ' <span class="n">' + ENTRIES.length + '</span></button>' +
  GROUPS.map(g => '<button class="chip" data-g="' + g.key + '" aria-pressed="false">' + g.label +
    ' <span class="n">' + byGroup[g.key].length + '</span></button>').join("");

document.getElementById("rail").innerHTML = GROUPS.map(g =>
  '<li><a href="#g-' + g.key + '"><span class="rn">' + g.code + ' · ' + byGroup[g.key].length + '</span>' +
  g.label + '<span class="bar"><i data-bar="' + g.key + '"></i></span></a></li>').join("");

const CHECK_SVG = '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" ' +
  'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.4 4.6 9 10 3.2"/></svg>';

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function render(){
  const q = query.trim().toLowerCase();
  let shown = 0, html = "";

  GROUPS.forEach(g => {
    if (filterGroup !== "all" && filterGroup !== g.key) return;
    const cards = byGroup[g.key].filter(e => {
      if (q && !(e[1] + " " + e[2] + " " + e[3].join(" ")).toLowerCase().includes(q)) return false;
      if (onlyOpen && e[3].every((_, i) => state[e.id + ":" + i])) return false;
      return true;
    });
    if (!cards.length) return;
    shown += cards.length;

    html += '<section class="cat" id="g-' + g.key + '"><div class="cat-head"><h2>' + esc(g.label) +
      '</h2><span class="en">' + esc(g.sub || "") + '</span><span class="cnt">' + cards.length + ' ' +
      LABELS.entryWord + '</span></div><div class="list">';

    cards.forEach(e => {
      const done = e[3].filter((_, i) => state[e.id + ":" + i]).length;
      html += '<article class="card' + (done === e[3].length ? " is-done" : "") + '">' +
        '<div class="gutter">' + e.id + '</div><div class="body">' +
        '<div class="title"><h3>' + esc(e[1]) + '</h3>' +
        (e[4] ? '<span class="derived">' + esc(LABELS.derived) + '</span>' : '') +
        '<span class="frac">' + done + '/' + e[3].length + '</span></div>' +
        '<p class="tag">' + esc(e[2]) + '</p><div class="checks">' +
        e[3].map((t, i) => {
          const k = e.id + ":" + i;
          return '<label class="check"><input type="checkbox" data-k="' + k + '"' +
            (state[k] ? " checked" : "") + '><span class="box">' + CHECK_SVG + '</span>' +
            '<span class="txt">' + esc(t) + '</span></label>';
        }).join("") + '</div></div></article>';
    });
    html += '</div></section>';
  });

  if (!shown) html = '<div class="empty"><b>' + esc(LABELS.emptyTitle) + '</b>' + esc(LABELS.emptyBody) + '</div>';
  document.getElementById("out").innerHTML = html;
  updateScore();
}

function updateScore(){
  const done = Object.keys(state).filter(k => state[k]).length;
  const pct = TOTAL ? Math.round(done / TOTAL * 100) : 0;
  document.getElementById("doneN").textContent = done;
  document.getElementById("pct").textContent = "%" + pct;
  document.getElementById("dial").setAttribute("stroke-dashoffset", String(2 * Math.PI * 33 * (1 - pct / 100)));
  document.documentElement.style.setProperty("--pct", pct + "%");
  GROUPS.forEach(g => {
    let tot = 0, d = 0;
    byGroup[g.key].forEach(e => e[3].forEach((_, i) => { tot++; if (state[e.id + ":" + i]) d++; }));
    const bar = document.querySelector('[data-bar="' + g.key + '"]');
    if (bar) bar.style.width = (tot ? d / tot * 100 : 0) + "%";
  });
}

document.getElementById("out").addEventListener("change", ev => {
  const input = ev.target.closest("input[type=checkbox]");
  if (!input) return;
  state[input.dataset.k] = input.checked;
  if (!input.checked) delete state[input.dataset.k];
  persist();
  const card = input.closest(".card");
  const all = card.querySelectorAll("input[type=checkbox]").length;
  const done = card.querySelectorAll("input[type=checkbox]:checked").length;
  card.querySelector(".frac").textContent = done + "/" + all;
  card.classList.toggle("is-done", done === all);
  updateScore();
  if (onlyOpen && done === all) setTimeout(render, 260);
});

chipsEl.addEventListener("click", ev => {
  const b = ev.target.closest(".chip");
  if (!b) return;
  filterGroup = b.dataset.g;
  chipsEl.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
  render();
});
document.getElementById("q").addEventListener("input", ev => { query = ev.target.value; render(); });
document.getElementById("onlyOpen").addEventListener("click", ev => {
  onlyOpen = !onlyOpen;
  ev.currentTarget.setAttribute("aria-pressed", String(onlyOpen));
  render();
});
document.getElementById("reset").addEventListener("click", () => {
  if (!Object.keys(state).length) return;
  if (!confirm(LABELS.resetAsk)) return;
  state = {}; persist(); render();
});

render();
</script>
